<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMM Burger Menu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="header-spacer"></div>
            <div class="brand-wrap">
                <div class="logo-circle">
                    <svg viewBox="0 0 64 64" width="38" height="38">
                        <circle cx="32" cy="32" r="30" fill="#1e2230" stroke="#e05a2b" stroke-width="2"/>
                        <path d="M16 26 C16 16, 48 16, 48 26 Z" fill="#e67e22"/>
                        <circle cx="24" cy="21" r="1" fill="#f1c40f"/>
                        <circle cx="32" cy="19" r="1" fill="#f1c40f"/>
                        <circle cx="40" cy="21" r="1" fill="#f1c40f"/>
                        <text x="32" y="34" font-family="Arial, sans-serif" font-weight="bold" font-size="8.5" fill="#ffffff" text-anchor="middle">MMM</text>
                        <rect x="15" y="37" width="34" height="5" rx="2.5" fill="#8e3b1e"/>
                        <path d="M16 44 L48 44 C48 49, 16 49, 16 44 Z" fill="#e67e22"/>
                    </svg>
                </div>
                <h1 class="site-title">MMM Burger Menu</h1>
            </div>

            <!-- Top-Right Cart Button -->
            <button class="cart-header-btn" id="cart-open-btn" aria-label="Корзина">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="cart-badge" id="cart-badge">0</span>
            </button>
        </div>
    </header>

    <!-- Category Filters -->
    <nav class="filter-nav">
        <div class="filter-buttons" id="filter-buttons">
            <button class="filter-btn active" data-category="all">Все</button>
            <button class="filter-btn" data-category="burger">Бургер</button>
            <button class="filter-btn" data-category="chicken">Чикен</button>
            <button class="filter-btn" data-category="lavash">Лаваш</button>
            <button class="filter-btn" data-category="pizza">Пицца</button>
        </div>
    </nav>

    <!-- Main Menu Grid -->
    <main class="main-content">
        <div class="menu-grid" id="menu-grid">
            <!-- Cards rendered via script.js -->
        </div>
    </main>

    <!-- Lightbox Modal for Enlarged Image -->
    <div class="image-modal" id="image-modal" aria-hidden="true">
        <div class="modal-backdrop" id="modal-backdrop"></div>
        <div class="modal-content">
            <button class="modal-close" id="modal-close" aria-label="Закрыть">&times;</button>
            <img src="" alt="" class="modal-img" id="modal-img">
            <div class="modal-info">
                <h3 class="modal-title" id="modal-title"></h3>
                <p class="modal-desc" id="modal-desc"></p>
                <div class="modal-footer">
                    <span class="modal-price" id="modal-price"></span>
                    <button type="button" class="modal-like-btn" id="modal-like-btn">
                        <span id="modal-like-icon">♡</span>
                        <span id="modal-like-text">В корзину</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Cart Drawer / Modal -->
    <div class="cart-modal" id="cart-modal" aria-hidden="true">
        <div class="cart-backdrop" id="cart-backdrop"></div>
        <div class="cart-panel">
            <div class="cart-header">
                <h2 class="cart-title">Корзина</h2>
                <button class="cart-close" id="cart-close" aria-label="Закрыть корзину">&times;</button>
            </div>
            <div class="cart-body" id="cart-body">
                <!-- Cart items rendered via script.js -->
            </div>
            <div class="cart-footer" id="cart-footer">
                <div class="customer-name-group">
                    <label for="customer-name" class="customer-name-label">Ваше имя <span class="req-star">*</span></label>
                    <input 
                        type="text" 
                        id="customer-name" 
                        class="customer-name-input" 
                        placeholder="Введите ваше имя..." 
                        autocomplete="name"
                    >
                    <div class="customer-name-error" id="customer-name-error">Пожалуйста, введите ваше имя для заказа</div>
                </div>

                <div class="cart-total-row">
                    <span>Итого:</span>
                    <span class="cart-total-price" id="cart-total-price">0 ₸</span>
                </div>
                <button type="button" class="cart-whatsapp-btn" id="cart-whatsapp-btn">
                    <svg viewBox="0 0 32 32" width="22" height="22">
                        <path fill="currentColor" d="M16.004 2.667C8.64 2.667 2.667 8.64 2.667 16c0 2.352.615 4.648 1.782 6.673L2.556 29.59l7.093-1.86A13.28 13.28 0 0 0 16.004 29.33c7.363 0 13.333-5.97 13.333-13.333S23.367 2.667 16.004 2.667zm0 24.432a11.06 11.06 0 0 1-5.637-1.543l-.404-.24-4.209 1.104 1.123-4.104-.264-.42A11.056 11.056 0 0 1 4.904 16c0-6.12 4.98-11.1 11.1-11.1 6.12 0 11.1 4.98 11.1 11.1 0 6.12-4.98 11.099-11.1 11.099zm6.09-8.312c-.334-.167-1.975-.975-2.281-1.086-.306-.112-.529-.167-.752.167-.223.335-.863 1.087-1.058 1.31-.195.223-.39.251-.724.084-.334-.167-1.411-.52-2.688-1.659-.994-.886-1.665-1.981-1.86-2.315-.195-.335-.021-.515.146-.682.15-.15.334-.39.501-.585.167-.195.223-.334.334-.557.112-.223.056-.418-.028-.585-.083-.167-.752-1.811-1.03-2.48-.271-.651-.547-.563-.752-.573l-.641-.011c-.223 0-.585.084-.891.418-.306.335-1.17 1.143-1.17 2.787s1.198 3.233 1.365 3.456c.167.223 2.357 3.599 5.71 5.047.798.344 1.421.55 1.906.704.801.255 1.53.219 2.106.133.643-.096 1.975-.808 2.253-1.588.279-.78.279-1.449.195-1.588-.083-.139-.306-.223-.64-.39z"/>
                    </svg>
                    Заказать в WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- Bottom-Right Floating WhatsApp Button -->
    <button type="button" class="whatsapp-float" id="whatsapp-float-btn" aria-label="Отправить корзину в WhatsApp">
        <svg viewBox="0 0 32 32" class="whatsapp-icon">
            <path fill="currentColor" d="M16.004 2.667C8.64 2.667 2.667 8.64 2.667 16c0 2.352.615 4.648 1.782 6.673L2.556 29.59l7.093-1.86A13.28 13.28 0 0 0 16.004 29.33c7.363 0 13.333-5.97 13.333-13.333S23.367 2.667 16.004 2.667zm0 24.432a11.06 11.06 0 0 1-5.637-1.543l-.404-.24-4.209 1.104 1.123-4.104-.264-.42A11.056 11.056 0 0 1 4.904 16c0-6.12 4.98-11.1 11.1-11.1 6.12 0 11.1 4.98 11.1 11.1 0 6.12-4.98 11.099-11.1 11.099zm6.09-8.312c-.334-.167-1.975-.975-2.281-1.086-.306-.112-.529-.167-.752.167-.223.335-.863 1.087-1.058 1.31-.195.223-.39.251-.724.084-.334-.167-1.411-.52-2.688-1.659-.994-.886-1.665-1.981-1.86-2.315-.195-.335-.021-.515.146-.682.15-.15.334-.39.501-.585.167-.195.223-.334.334-.557.112-.223.056-.418-.028-.585-.083-.167-.752-1.811-1.03-2.48-.271-.651-.547-.563-.752-.573l-.641-.011c-.223 0-.585.084-.891.418-.306.335-1.17 1.143-1.17 2.787s1.198 3.233 1.365 3.456c.167.223 2.357 3.599 5.71 5.047.798.344 1.421.55 1.906.704.801.255 1.53.219 2.106.133.643-.096 1.975-.808 2.253-1.588.279-.78.279-1.449.195-1.588-.083-.139-.306-.223-.64-.39z"/>
        </svg>
        
    </button>

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
